name: Verify

on:
  pull_request:
  push:
    branches: [master, lib-completion]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: 'true'
  LEFTHOOK: '0'

jobs:
  verify:
    # pinned (not ubuntu-latest) so fonts and rasterisation match the committed Linux baselines
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # pnpm/action-setup is blocked by the repo's Actions policy (github-owned actions only); corepack reads `packageManager`
      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # lint, typecheck, test, build (the local gate)
      - run: pnpm verify

      # coverage artifact (test:coverage + upload) is added once the coverage gate lands

      - run: pnpm storybook:build

      # run every story's `play` in real Chromium (vitest browser mode + @storybook/addon-vitest)
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:storybook
      # pixel baselines (visual/__screenshots__/*-chromium-linux.png); see README "Visual regression tests"
      - run: pnpm test:visual
